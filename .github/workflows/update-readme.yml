name: Update README

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  push:
    branches:
      - main
  workflow_dispatch:         # Allow manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      issues: write   # 失败告警需要开 issue
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pyyaml

      - name: Update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/update_readme.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to README.md"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "README.md has changed"
          fi

      - name: Commit and push updated README
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: auto-update README [skip ci]"
          # --- 改造：bot 不再直推 main，改为开 PR 并自动合并 ---
          git fetch origin main --depth=1 -q
          if [ -z "$(git log FETCH_HEAD..HEAD --oneline)" ]; then
            echo "No new commits; nothing to do."
            exit 0
          fi
          BRANCH="bot/$(date -u +%Y%m%d-%H%M%S)"
          git push -u origin "HEAD:$BRANCH"
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          gh pr create --base main --head "$BRANCH" \
            --title "$(git log -1 --pretty=%s)" \
            --body "Automated update by workflow: ${{ github.workflow }}"
          gh pr merge "$BRANCH" --squash --delete-branch
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ 工作流 ${{ github.workflow }} 运行失败"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="[${{ github.workflow }}]($RUN_URL) 于 $(date -u '+%Y-%m-%d %H:%M UTC') 失败（分支 ${{ github.ref_name }}，触发 ${{ github.event_name }}）。请查看日志。"
          EXISTING=$(gh issue list --state open --search "in:title $TITLE" --json number,title --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create ci-failure --color d73a4a --description "自动化工作流失败告警" 2>/dev/null || true
            gh issue create --title "$TITLE" --body "$BODY" --label ci-failure 2>/dev/null || gh issue create --title "$TITLE" --body "$BODY"
          fi
